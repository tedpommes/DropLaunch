# Tests and builds DropLaunch.exe on GitHub's own Windows machines, on every push and pull
# request (and with "Run workflow"). The exe is kept as the "DropLaunch" artifact of the run.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Test
        run: cargo test --locked

      - name: Build
        run: |
          cargo build --release --locked
          New-Item -ItemType Directory -Force ..\out | Out-Null
          Copy-Item target\release\droplaunch.exe ..\out\DropLaunch.exe

      - name: Keep the exe
        uses: actions/upload-artifact@v4
        with:
          name: DropLaunch
          path: out/DropLaunch.exe
          if-no-files-found: error
