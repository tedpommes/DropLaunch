[package]
name = "droplaunch"
version = "2.0.0"
description = "DropLaunch - Rust map testing made simple"
authors = ["TedPommes"]
license = "GPL-3.0-or-later"
repository = "https://github.com/tedpommes/DropLaunch"
edition = "2021"
rust-version = "1.91"
default-run = "droplaunch"

[lib]
name = "droplaunch_lib"
path = "src/lib.rs"

[[bin]]
name = "droplaunch"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
# en.json goes into the exe compressed (build.rs); the same brotli Tauri uses for the UI's files.
brotli = "9"

[dependencies]
# Without the default "dynamic-acl" (the command permissions are checked from a list built in at
# compile time instead of one loaded at runtime: a smaller exe) and the Linux-only x11/dbus.
tauri = { version = "2.12", default-features = false, features = ["wry", "compression", "common-controls-v6"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
brotli = "9"
portable-pty = "0.9"
# HTTPS: Windows' own TLS there (native-tls, below), rustls elsewhere.
ureq = { version = "2.12", default-features = false, features = ["gzip"] }
# Unpacked with miniz_oxide, the decompressor the HTTP client already brings along.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
notify = "8"
blake3 = "1"
# Self-update signatures.
ed25519-dalek = { version = "3", default-features = false }
# Map pictures for the playtest page (.map files are LZ4 compressed); block decoding only.
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode", "checked-decode"] }

[dev-dependencies]
# examples/mapinfo.rs (map preview research)
png = "0.17"
# examples/release.rs (a new release key)
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Windows notifications (WinRT); the same version Tauri already uses.
windows = { version = "0.62", features = ["Foundation", "Data_Xml_Dom", "UI_Notifications", "Win32_System_Com"] }
# HTTPS with Windows' own TLS (SChannel) and certificates: no TLS library in the exe.
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[target.'cfg(unix)'.dependencies]
flate2 = "1"
tar = "0.4"

[features]
default = ["custom-protocol"]
# Serve the ui/ folder from inside the exe (what `tauri build` normally switches on),
# so a plain `cargo build --release` produces the final single-file app.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
